services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    # Génère un certificat self-signed au premier démarrage si absent, puis lance nginx
    command: >-
      sh -c "apk add --no-cache openssl &&
      if [ ! -f /etc/nginx/certs/nginx.crt ]; then
        openssl req -x509 -nodes -days 3650 -newkey rsa:4096 -keyout /etc/nginx/certs/nginx.key -out /etc/nginx/certs/nginx.crt -subj '/CN=localhost';
      fi &&
      nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend
    networks:
      - chatbot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://localhost
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - chatbot-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - METADATA_DIR=/app/documents/metadata
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
      - OLLAMA_EMBED_MODEL=mxbai-embed-large
      # Modèle d'embedding — changer + rebuild + re-indexation requise si switch
      # - EMBED_HF_MODEL=mixedbread-ai/mxbai-embed-large-v1  # ← fallback mxbai (670MB RAM)
      # - EMBED_HF_MODEL=BAAI/bge-m3-unsupervised             # ← bge-m3 générique (symétrique)
      - EMBED_HF_MODEL=BAAI/bge-m3                            # ← bge-m3 supervisé (meilleur RAG asymétrique)
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - USE_DOCLING=true
      - DOCLING_OCR=false
      - DOCLING_TABLE_MODE=accurate
      - USE_RERANKER=true
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - USE_HYBRID_SEARCH=true
      - USE_CONTEXTUAL_RETRIEVAL=true
      - CONTEXTUAL_OLLAMA_URL=http://ollama:11434
      - CONTEXTUAL_MODEL=qwen3.5:4b
      - CONTEXTUAL_MAX_WORKERS=5
      - USE_SEMANTIC_CHUNKING=true
      - SEMANTIC_BREAKPOINT_THRESHOLD=60
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - USE_COLBERT=false
      - COLBERT_MODEL=colbert-ir/colbertv2.0
      - USE_HF_EMBEDDINGS=true
      - OLLAMA_MODEL=qwen3.5:4b
      # /no_think désactive le mode raisonnement de Qwen3 pour les réponses RAG
      - ENABLE_NO_THINK=true
      # ── Group A — nouvelles fonctionnalités RAG ─────────────────────────
      # A3 — Reranker sur GPU fp16 (~570MB VRAM). Vérifier budget VRAM avant activation.
      # qwen3.5:4b (5.17GB) + reranker fp16 (0.57GB) = 5.74GB — limite sur RTX 3060 6GB
      - USE_RERANKER_GPU=false
      # A2 — Cap diversité sources : max N chunks par document (0=désactivé)
      - MAX_CHUNKS_PER_SOURCE=0
      # A5 — Multi-query retrieval : génère 2 variantes de la question (3 queries total)
      - USE_MULTI_QUERY=true
      # A6 — HyDE : doc hypothétique comme query vectorielle (désactivé par défaut)
      - USE_HYDE=true
      # A4 — MMR : diversification des résultats après reranking
      - USE_MMR=true
      - MMR_LAMBDA=0.6
      # A7 — CRAG light : évalue qualité top chunks, re-query si insuffisant (très coûteux)
      - USE_CRAG=false
      # A8 — Filtre <think>...</think> dans le stream (inutile si ENABLE_NO_THINK=true)
      - FILTER_THINK_FROM_STREAM=false
      # ── RAGAS eval — LLM-as-judge asynchrone ──────────────────────────────────
      - EVAL_ENABLED=true
      - EVAL_OLLAMA_URL=http://ollama-contextual:11434
      - EVAL_JUDGE_MODEL=qwen3.5:0.8b
      # num_ctx plafond hardware : RTX 3060 6GB = 8192 max / RTX 5090 = 32768
      - OLLAMA_NUM_CTX_HARD_MAX=8192
      # ── Group B — Qdrant + bge-m3 + parent/child ─────────────────────────────
      # B1 — Backend vectoriel : "chroma" (fallback) ou "qdrant"
      # - VECTOR_DB=chroma  # ← fallback ChromaDB
      - VECTOR_DB=qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # B2 — bge-m3 : EMBED_HF_MODEL géré en haut du fichier (ligne ~28)
      - EMBED_SPARSE=true   # hybrid dense+sparse (bge-m3 + Qdrant requis)
      # B3 — Parent/child chunking (nécessite re-indexation complète après activation)
      - USE_PARENT_CHILD=true
      # CHILD_CHUNK_SIZE_TOKENS=250
      # PARENT_CHUNK_SIZE_TOKENS=1000
      # ── Auth & RBAC ────────────────────────────────────────────────────────────
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://chatbot:chatbot@postgres:5432/chatbot}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme-generate-with-openssl-rand-hex-32}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - RBAC_CONFIG_PATH=/app/config/rbac.yaml
    volumes:
      - ./backend:/app/backend # Code source en temps réel
      - ./alembic.ini:/app/alembic.ini:ro
      - ./scripts:/app/scripts
      - documents_store:/app/documents
      - hf_cache:/root/.cache/huggingface
      - ./backend/config/rbac.yaml:/app/config/rbac.yaml:ro
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - chatbot-network

  ollama-contextual:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=none # Force CPU uniquement
      - OLLAMA_NUM_THREADS=4
    volumes:
      - ollama_contextual_models:/root/.ollama
    networks:
      - chatbot-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Donne 15 min à Ollama pour charger le modèle en mémoire.
      - OLLAMA_LOAD_TIMEOUT=900
      # KV cache en 8-bit : réduit la VRAM du cache de ~50% → permet 8192 tokens de contexte
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      # Garde le modèle chargé en VRAM indéfiniment → évite reload + GPU discovery failure (WSL2)
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - chatbot-network

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=True
    networks:
      - chatbot-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=chatbot
      - POSTGRES_PASSWORD=chatbot
      - POSTGRES_DB=chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network

  # Group B — activer en changeant VECTOR_DB=qdrant dans backend environment
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge

volumes:
  chroma_data:
  documents_store:
  ollama_models:
  ollama_contextual_models:
  hf_cache:
  qdrant_data:
  postgres_data:
