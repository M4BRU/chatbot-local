services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    # Monte le code source en live — aucun rebuild si tu modifies un .py
    volumes:
      - ./backend:/app/backend
      - documents_store:/app/documents
      - hf_cache:/root/.cache/huggingface
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - METADATA_DIR=/app/documents/metadata
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
      - OLLAMA_EMBED_MODEL=mxbai-embed-large
      - EMBED_HF_MODEL=mixedbread-ai/mxbai-embed-large-v1
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - USE_DOCLING=true
      - DOCLING_OCR=false
      - DOCLING_TABLE_MODE=accurate
      - USE_RERANKER=true
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - USE_HYBRID_SEARCH=true
      - USE_CONTEXTUAL_RETRIEVAL=false
      - CONTEXTUAL_MAX_WORKERS=3
      - USE_SEMANTIC_CHUNKING=true
      - SEMANTIC_BREAKPOINT_THRESHOLD=95
      - USE_COLBERT=false
      - COLBERT_MODEL=colbert-ir/colbertv2.0
      - USE_HF_EMBEDDINGS=true
    # --reload : uvicorn redémarre automatiquement à chaque modification .py
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - ollama
      - chromadb
    networks:
      - chatbot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - chatbot-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - chatbot-network

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=True
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge

volumes:
  chroma_data:
  documents_store:
  ollama_models:
  hf_cache:
